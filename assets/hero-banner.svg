<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Galla Jagadeesh — AI and Full Stack Developer</title>
  <desc id="desc">Animated neon developer profile banner featuring AI, full stack, n8n and agentic systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".48" stop-color="#0b1026"/><stop offset="1" stop-color="#160b2d"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a855f7;#f472b6;#22d3ee" dur="7s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#f472b6;#22d3ee;#8b5cf6" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#22d3ee;#a855f7;#f472b6" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
    <radialGradient id="orb"><stop stop-color="#8b5cf6" stop-opacity=".62"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="terminalClip"><rect x="75" y="91" width="615" height="188" rx="8"/></clipPath>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="24" fill="url(#grid)"/>
  <circle cx="1035" cy="70" r="210" fill="url(#orb)"><animate attributeName="cx" values="1035;930;1035" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="216" r="112" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="15 12" opacity=".8"><animateTransform attributeName="transform" type="rotate" from="0 1040 216" to="360 1040 216" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="216" r="76" fill="#0b1026" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  <text x="1040" y="207" text-anchor="middle" fill="url(#neon)" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="800">AI</text>
  <text x="1040" y="238" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="3">BUILDER</text>
  <g fill="#22d3ee"><circle cx="1040" cy="82" r="5"/><circle cx="1174" cy="216" r="5"/><circle cx="1040" cy="350" r="5"/><circle cx="906" cy="216" r="5"/></g>
  <rect x="54" y="50" width="670" height="267" rx="16" fill="#090d19" stroke="#334155"/>
  <rect x="54" y="50" width="670" height="41" rx="16" fill="#131827"/><rect x="54" y="75" width="670" height="16" fill="#131827"/>
  <circle cx="80" cy="71" r="6" fill="#ff5f57"/><circle cx="101" cy="71" r="6" fill="#febc2e"/><circle cx="122" cy="71" r="6" fill="#28c840"/>
  <text x="151" y="76" fill="#64748b" font-family="Consolas,monospace" font-size="13">jagadeesh@ai-lab: ~/build</text>
  <g clip-path="url(#terminalClip)" font-family="Consolas,monospace">
    <text x="78" y="124" fill="#22d3ee" font-size="15">$ whoami</text>
    <text x="78" y="166" fill="#f8fafc" font-size="34" font-weight="700">Galla Jagadeesh</text>
    <rect x="78" y="181" width="545" height="3" rx="2" fill="url(#neon)" filter="url(#glow)"/>
    <text x="78" y="218" fill="#a78bfa" font-size="17">AI &amp; Full Stack Developer</text>
    <text x="78" y="249" fill="#94a3b8" font-size="15">Building agents, SaaS products &amp; smart automations</text>
    <text x="78" y="282" fill="#22d3ee" font-size="15">$ launch_future --mode intelligent</text>
    <rect x="429" y="267" width="10" height="19" fill="#f472b6"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <g transform="translate(66 345)"><rect width="150" height="42" rx="21" fill="#0e2130" stroke="#22d3ee"/><text x="75" y="26" fill="#67e8f9">AGENTIC AI</text></g>
    <g transform="translate(230 345)"><rect width="150" height="42" rx="21" fill="#1c1633" stroke="#8b5cf6"/><text x="75" y="26" fill="#c4b5fd">PYTHON · FLASK</text></g>
    <g transform="translate(394 345)"><rect width="150" height="42" rx="21" fill="#2b1227" stroke="#f472b6"/><text x="75" y="26" fill="#f9a8d4">n8n AUTOMATION</text></g>
    <g transform="translate(558 345)"><rect width="150" height="42" rx="21" fill="#0e2130" stroke="#22d3ee"/><text x="75" y="26" fill="#67e8f9">REACT · SaaS</text></g>
  </g>
  <path d="M0 417 H1200" stroke="url(#neon)" stroke-width="5"><animate attributeName="stroke-dasharray" values="0 1200;1200 0;0 1200" dur="6s" repeatCount="indefinite"/></path>
</svg>
