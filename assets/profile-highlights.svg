<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">Profile highlights</title><desc id="desc">Highlights for AI development, full-stack development, automation, machine learning and open source.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#17142c"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
  <rect width="900" height="190" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <text x="32" y="43" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Profile Highlights</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(92 112)"><circle r="39" fill="#161b22" stroke="url(#ring)" stroke-width="3"/><text y="-2" fill="#67e8f9" font-size="18" font-weight="700">AI</text><text y="20" fill="#c9d1d9" font-size="11">BUILDER</text></g>
    <g transform="translate(270 112)"><circle r="39" fill="#161b22" stroke="url(#ring)" stroke-width="3"/><text y="-2" fill="#a78bfa" font-size="17" font-weight="700">FULL</text><text y="20" fill="#c9d1d9" font-size="11">STACK</text></g>
    <g transform="translate(450 112)"><circle r="39" fill="#161b22" stroke="url(#ring)" stroke-width="3"/><text y="-2" fill="#f9a8d4" font-size="15" font-weight="700">AUTO</text><text y="20" fill="#c9d1d9" font-size="11">MATION</text></g>
    <g transform="translate(630 112)"><circle r="39" fill="#161b22" stroke="url(#ring)" stroke-width="3"/><text y="-2" fill="#67e8f9" font-size="17" font-weight="700">ML</text><text y="20" fill="#c9d1d9" font-size="11">ENGINEER</text></g>
    <g transform="translate(808 112)"><circle r="39" fill="#161b22" stroke="url(#ring)" stroke-width="3"/><text y="-2" fill="#a78bfa" font-size="17" font-weight="700">OPEN</text><text y="20" fill="#c9d1d9" font-size="11">SOURCE</text></g>
  </g>
</svg>
